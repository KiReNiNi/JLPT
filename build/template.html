<title>橘园 N1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* ===== 设计变量（美化时主要改这里） =====
   页面结构：顶栏 .top → 内容 .stack → 固定底栏 .foot
   橘园皮肤 body[data-skin="orchard"]：#bgimg 插画背景 + 磨砂卡片；简洁皮肤：淡色纯底，跟随深浅模式 */
:root{
  --bg:#F3F1F6; --card:#FFFFFF; --card2:#F7F5FA; --ink:#2C2733; --mute:#7B7387; --line:#E3DEE9;
  --accent:#E07A38; --accent2:#C9652A; --accent-soft:#FBE7D8; --lav:#8F7EC6; --lav-soft:#ECE7F7;
  --sel:#4A72D6; --sel-bg:#E2EAFB; --mark:#2F6B28; --mark-bg:#D3EBC8;
  --hold:#E2B32E; --hold-bg:#FFF4CC; --good:#2E8B57; --good-bg:#DDF1E5; --bad:#CC4B45; --bad-bg:#FBE3E1;
  --on-accent:#FFFFFF; --sheet:#FBF8FC; --glass:none;
  --shadow:0 1px 2px rgba(60,40,80,.06),0 4px 14px rgba(60,40,80,.05);
  --r-card:20px; --r-ctl:14px;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","PingFang SC",sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-ja:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1920; --card:#25222C; --card2:#2C2834; --ink:#ECE7F3; --mute:#A79FB3; --line:#3A3544;
  --accent:#F0955A; --accent2:#F6AD7B; --accent-soft:#4A3022; --lav:#B4A6E6; --lav-soft:#332D45;
  --sel:#88A6F2; --sel-bg:#27324D; --mark:#AEDDA0; --mark-bg:#2B4527;
  --hold:#E9C552; --hold-bg:#43391A; --good:#6FCB95; --good-bg:#1F3A2A; --bad:#F08B85; --bad-bg:#4A2422;
  --on-accent:#1B1920; --sheet:#211E27; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1920; --card:#25222C; --card2:#2C2834; --ink:#ECE7F3; --mute:#A79FB3; --line:#3A3544;
  --accent:#F0955A; --accent2:#F6AD7B; --accent-soft:#4A3022; --lav:#B4A6E6; --lav-soft:#332D45;
  --sel:#88A6F2; --sel-bg:#27324D; --mark:#AEDDA0; --mark-bg:#2B4527;
  --hold:#E9C552; --hold-bg:#43391A; --good:#6FCB95; --good-bg:#1F3A2A; --bad:#F08B85; --bad-bg:#4A2422;
  --on-accent:#1B1920; --sheet:#211E27; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
body[data-skin="orchard"]{
  --bg:#EAD8E4; --card:rgba(255,250,246,.82); --card2:rgba(255,247,242,.66); --ink:#3B2B3A; --mute:#7D6979; --line:rgba(150,110,150,.22);
  --accent:#E8803C; --accent2:#C8652B; --accent-soft:rgba(250,214,186,.75); --lav:#8B76C2; --lav-soft:rgba(234,226,248,.85);
  --sel:#4A72D6; --sel-bg:#DCE6FB; --mark:#2F6B28; --mark-bg:#CDEAC0;
  --hold:#D9A21C; --hold-bg:#FFF0BF; --good:#2E8B57; --good-bg:#DAF0E2; --bad:#C9443E; --bad-bg:#FADCDA;
  --on-accent:#FFFFFF; --sheet:#FBF2EE; --glass:blur(14px) saturate(1.15);
  --shadow:0 2px 6px rgba(120,70,90,.10),0 10px 30px rgba(120,70,90,.10);
  color-scheme:light;
}

/* ===== 基础 ===== */
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
#bgimg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;pointer-events:none}
#bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,244,238,.15),rgba(255,240,236,.35) 40%,rgba(250,236,240,.55))}
body:not([data-skin="orchard"]) #bgimg{display:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body[data-skin="orchard"]::before{background:transparent}
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 140px}
:lang(ja){font-family:var(--f-ja)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
h1{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0}
svg{width:18px;height:18px;flex:none}
.stack{display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;letter-spacing:.06em;color:var(--mute)}
.hint{font-size:13px;color:var(--mute)}
.empty{text-align:center;padding:28px 12px;color:var(--mute);background:var(--card);border-radius:var(--r-card)}
.warn{background:var(--bad-bg);color:var(--bad);border-radius:var(--r-ctl);padding:10px 14px;font-size:14px}

/* ===== 顶栏 ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding-block:12px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
body[data-skin="orchard"] .top{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:rgba(255,246,242,.35)}
body:not([data-skin="orchard"]) .top{background:var(--bg)}
.top .ttl{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl.prog small{font-size:14px;color:var(--mute);font-weight:500}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;min-width:40px;padding:0 12px;border-radius:999px;background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:var(--shadow)}
.cloud{font-size:12px;color:var(--mute);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.cloud i{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.cloud.ok i{background:var(--good)} .cloud.off i{background:var(--bad)} .cloud.ld i{background:var(--hold)}
/* 模式切换：蓝 = 选答案，绿 = 标生词 */
.mode{display:inline-flex;padding:3px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.mode button{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:999px;font-size:13px;color:var(--mute)}
.mode button svg{width:16px;height:16px}
.mode .a.on{background:var(--sel);color:var(--on-accent)}
.mode .k.on{background:var(--mark);color:var(--on-accent)}
@media (max-width:380px){.mode button span{display:none}}

/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:999px;font-weight:600;font-size:15px;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 18px rgba(232,128,60,.28)}
.btn.sec{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:var(--shadow)}
.btn.full{width:100%}
.btn:disabled{opacity:.45}

/* ===== 首页 ===== */
.hero{padding:18px 4px 4px}
.hero h1{font-size:30px;letter-spacing:.02em}
.hero p{margin:4px 0 0;color:var(--mute)}
.resume{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;padding:14px 18px;border-radius:var(--r-card);background:var(--accent-soft);border:1.5px dashed var(--accent)}
.resume .rs-t{font-family:var(--f-display);font-weight:700;font-size:17px}
.resume .rs-s{grid-column:1;font-size:13px;color:var(--mute)}
.resume svg{grid-row:1/3;grid-column:2;color:var(--accent);width:24px;height:24px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-radius:var(--r-ctl);box-shadow:var(--shadow);padding:12px 14px}
.tile b{font-family:var(--f-display);font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--mute)}
.tile.hold b{color:var(--hold)} .tile.word b{color:var(--mark)}
.papers{display:flex;flex-direction:column;gap:10px}
.paper{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 18px;border-radius:var(--r-card);background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:var(--shadow)}
.paper .pp{flex:1;min-width:0;display:flex;flex-direction:column}
.paper .yr{font-family:var(--f-display);font-weight:700;font-size:17px}
.paper .ps{font-size:13px;color:var(--mute)}
.paper .bar{display:block;height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.paper .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px}
.paper .pct{font-family:var(--f-display);font-size:18px;color:var(--accent2);font-variant-numeric:tabular-nums}
.paper.off{opacity:.55;box-shadow:none}

/* ===== 套卷题库 ===== */
.tabs{display:flex;gap:4px;background:var(--card2);border-radius:999px;padding:4px;backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.tabs button{flex:1;height:36px;border-radius:999px;font-size:14px;color:var(--mute)}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.tabs button:disabled{opacity:.5}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.flt{display:inline-flex;align-items:center;gap:6px;flex:none;height:34px;padding:0 12px;border-radius:999px;font-size:13px;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.flt i{width:12px;height:12px;border-radius:4px}
.flt.hold i{background:var(--hold-bg);box-shadow:inset 0 0 0 1.5px var(--hold)}
.flt.pass i{box-shadow:inset 0 0 0 2.5px var(--ink)}
.flt.wrong i{background:var(--bad);border-radius:50%;width:8px;height:8px}
.flt.on{background:var(--ink);color:var(--bg)}
.flt.on.pass i{box-shadow:inset 0 0 0 2.5px var(--bg)}
.grp{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.grp-h{display:flex;width:100%;align-items:center;gap:10px;padding:15px 18px;text-align:left}
.grp-h b{flex:1;font-size:16px}
.grp-h .gs{font-size:13px;color:var(--mute)}
.chev{width:18px;height:18px;color:var(--mute);transition:transform .2s}
.open>button>.chev,.grp.open .grp-h .chev{transform:rotate(90deg)}
.qlist{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}
.qc{position:relative;display:flex;flex-direction:column;width:100%;text-align:left;background:var(--card2);border-radius:var(--r-ctl);padding:10px 14px;box-shadow:inset 0 0 0 1px transparent}
.qc .qn{font-size:12px;font-weight:700}
.qc .s{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:14px}
.qc.hold{background:var(--hold-bg)}
.qc.pass{box-shadow:inset 0 0 0 2.5px var(--ink)}
.dot{position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--bad)}

/* ===== 题目卡 ===== */
.card{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px}
.qhead{display:flex;align-items:center;gap:8px;min-height:32px}
.qhead .tag-l{flex:1;min-width:0;font-size:13px;color:var(--mute)}
.peek{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--mute)}
.peek.on{background:var(--lav-soft);color:var(--lav)}
.peek svg{width:17px;height:17px}
.stem{font-size:19px;line-height:2.05;margin:6px 0 2px}
.stem-sm{font-size:16px;margin-top:12px}
.stem-word{font-size:24px;font-weight:700}
.u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.blank{display:inline-block;min-width:3.2em;text-align:center;color:var(--mute)}
.psg-intro{font-size:13px;color:var(--mute);margin:4px 0 6px}
.psg{font-size:16px;line-height:2;max-height:46vh;overflow:auto;padding:12px 14px;border-radius:var(--r-ctl);background:var(--card2)}
.psg p{margin:0 0 .6em;text-indent:1em}
.psg .blank{min-width:2.4em;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:6px;font-size:13px;line-height:1.5;padding:0 4px}
.psg .blank.cur{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--accent-soft);color:var(--accent2);font-weight:700}
.opts{display:grid;gap:10px;margin-top:14px}
.opts.two{grid-template-columns:1fr 1fr}
.op{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:var(--r-ctl);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);min-width:0;font-size:16px;line-height:1.7}
body[data-skin="orchard"] .op{background:rgba(255,252,250,.92)}
.op .no{font-family:var(--f-display);font-weight:700;color:var(--mute);flex:none;width:1.1em}
.op .tx{min-width:0;flex:1}
.op .sub{display:block;font-size:13px;color:var(--mute);line-height:1.5;margin-top:2px}
.op .tag{flex:none;font-size:12px;font-weight:700}
.op .tag.ok{color:var(--good)} .op .tag.ng{color:var(--bad)}
.op.x .main{text-decoration:line-through;color:var(--mute)}
.ans .op.pick{background:var(--sel-bg);box-shadow:inset 0 0 0 2px var(--sel)}
.ans .op.pick .no{color:var(--sel)}
.ans .op.right{background:var(--card);box-shadow:inset 0 0 0 2px var(--good)}
.ans .op.right .no{color:var(--good)}
.ans .op.wrong{background:var(--bad-bg);box-shadow:inset 0 0 0 2px var(--bad)}
.ans .op.wrong .no{color:var(--bad)}
/* 排序题 */
.sortline{font-size:18px;line-height:2.4}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:4.2em;min-height:1.8em;margin:0 3px;padding:0 6px;border-bottom:2px solid var(--mute);vertical-align:middle;font-size:15px;line-height:1.4;cursor:pointer}
.slot.star{border-bottom-color:var(--accent);color:var(--accent2)}
.slot.f{background:var(--sel-bg);border-radius:8px 8px 0 0;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:9px 14px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-size:15px}
.chip .no{font-weight:700;color:var(--mute)}
.chip.used{opacity:.35}
/* 解析 */
.exp{margin-top:14px;padding:14px 16px;border-radius:var(--r-ctl);background:var(--lav-soft);font-size:14px;line-height:1.75}
.exp .zh{font-size:15px}
.exp .pt{margin-top:8px}
.exp .pt b{color:var(--lav)}
.exp .full{font-size:16px;margin-bottom:4px}
.exp .starw{color:var(--accent2)}
.exp .ord{font-size:13px;color:var(--mute);margin-bottom:6px}
.verdict{font-weight:700;font-size:14px;margin-bottom:6px}
.verdict.ok{color:var(--good)} .verdict.ng{color:var(--bad)} .verdict.na{color:var(--mute)}
.times{font-size:12px;color:var(--mute);margin-top:8px}
/* 备用 / 过 */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.act{min-height:46px;border-radius:var(--r-ctl);font-weight:600;background:var(--card2);box-shadow:inset 0 0 0 1.5px var(--line)}
.act.hold.on{background:var(--hold-bg);box-shadow:inset 0 0 0 2px var(--hold)}
.act.pass.on{box-shadow:inset 0 0 0 2.5px var(--ink)}

/* ===== 标生词 ===== */
.marking .tk{box-shadow:inset 0 0 0 1px var(--line);border-radius:6px;padding:1px 3px;margin:0 1px;cursor:pointer}
.marking .tk.on{background:var(--mark-bg);color:var(--mark);box-shadow:none}
.marking .op.mk,.marking .chip.mk{cursor:pointer}
.marking .op.whole,.marking .chip.whole{background:var(--mark-bg);box-shadow:inset 0 0 0 2px var(--mark)}
.marking .op.whole .no,.marking .chip.whole .no{color:var(--mark)}
.markbar{display:flex;align-items:center;gap:4px;margin:0 auto 10px;width:fit-content;max-width:100%;padding:5px;border-radius:999px;background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:var(--shadow)}
.markbar .mb-n{padding:0 10px;font-size:13px;white-space:nowrap}
.markbar .mb-n em{font-style:normal;color:var(--accent2);margin-left:4px}
.markbar .mb-i,.markbar .mb-ok{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;color:var(--mute)}
.markbar .mb-ok{background:var(--mark);color:var(--on-accent)}
.markbar button:disabled{opacity:.35}

/* ===== 备注（可收起） ===== */
.note{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.note-h{display:flex;align-items:center;gap:10px;width:100%;padding:13px 18px;text-align:left}
.note-t{font-size:14px;font-weight:600;flex:none}
.note-pv{flex:1;min-width:0;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-b{position:relative;padding:0 14px 14px}
.note textarea{width:100%;min-height:90px;border-radius:var(--r-ctl);border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--card2);color:var(--ink);padding:10px 50px 10px 12px;font:inherit;font-size:14px;resize:vertical}
.note-ok{position:absolute;right:22px;bottom:24px;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--card);color:var(--mute);box-shadow:var(--shadow)}
.note-ok.dirty{background:var(--accent);color:var(--on-accent)}

/* ===== 底栏 ===== */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.foot>*{pointer-events:auto}
.foot .in{max-width:680px;margin:0 auto;display:flex;gap:10px}
.foot .in .btn{flex:1}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots button{width:28px;height:28px;border-radius:8px;font-size:11px;background:var(--card2);color:var(--mute);font-variant-numeric:tabular-nums}
.dots button.done{background:var(--sel-bg);color:var(--sel)}
.dots button.ok{background:var(--good-bg);color:var(--good)}
.dots button.ng{background:var(--bad-bg);color:var(--bad)}
.dots button.cur{box-shadow:0 0 0 2px var(--accent)}

/* ===== 选题 ===== */
.fs{display:flex;flex-direction:column;gap:10px;background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-radius:var(--r-card);box-shadow:var(--shadow);padding:16px 18px}
.chs{display:flex;flex-wrap:wrap;gap:8px}
.ch{height:38px;padding:0 14px;border-radius:999px;background:var(--card2);box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px;white-space:nowrap}
.ch.on{background:var(--accent);box-shadow:none;color:var(--on-accent)}
.ch:disabled{opacity:.4}
.stepper{display:flex;align-items:center;gap:10px}
.stp{width:44px;height:44px;border-radius:50%;background:var(--card2);box-shadow:inset 0 0 0 1.5px var(--line);font-size:20px}
.stepper output{min-width:56px;text-align:center;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stepper .ch{margin-left:auto}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}

/* ===== 结果 ===== */
.score{text-align:center;padding:26px 16px;background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-radius:var(--r-card);box-shadow:var(--shadow)}
.score b{font-family:var(--f-display);font-size:48px;color:var(--accent2);font-variant-numeric:tabular-nums}
.score span{color:var(--mute)}
.score p{margin:4px 0 0;font-size:13px;color:var(--mute)}
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:var(--r-ctl);background:var(--card)}
.rrow.hold{background:var(--hold-bg)}
.rrow.pass{box-shadow:inset 0 0 0 2.5px var(--ink)}
.rrow .ic{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.rrow .ic.ok{background:var(--good-bg);color:var(--good)} .rrow .ic.ng{background:var(--bad-bg);color:var(--bad)} .rrow .ic.na{background:var(--line);color:var(--mute)}
.rrow .t{flex:1;min-width:0;display:flex;flex-direction:column}
.rrow .t small{color:var(--mute)}
.rrow .t .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .r{font-size:12px;color:var(--mute);white-space:nowrap}

/* ===== 单词 ===== */
.wd{display:flex;gap:12px;align-items:flex-start;background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-radius:var(--r-card);box-shadow:var(--shadow);padding:14px 16px}
.wd .main{flex:1;min-width:0}
.wd .w{font-size:19px;font-weight:600}
.wd .rd{font-size:13px;color:var(--mute);margin-left:6px}
.wd .z{font-size:14px;margin-top:2px}
.wd .ctx{font-size:13px;color:var(--mute);margin-top:4px;line-height:1.6}
.wd .ctx em{font-style:normal;background:var(--mark-bg);color:var(--mark);border-radius:4px;padding:0 3px}
.wd .src{font-size:12px;color:var(--mute);margin-top:2px}
.wd .del{flex:none;height:32px;padding:0 12px;border-radius:999px;font-size:12px;color:var(--mute);background:var(--card2)}
.wd .del.sure{background:var(--bad);color:var(--on-accent)}

/* ===== 弹层 ===== */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(40,25,45,.35)}
.sheet .pn{display:flex;flex-direction:column;gap:12px;width:100%;max-width:680px;background:var(--sheet);border-radius:24px 24px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:86vh;overflow:auto}
.sh-h{display:flex;align-items:center;justify-content:space-between}
.sh-h b{font-family:var(--f-display);font-size:18px}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bgs button{aspect-ratio:9/16;width:100%;border-radius:12px;background-color:var(--card2);background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px var(--line)}
.bgs button.on{box-shadow:0 0 0 3px var(--accent)}
.bgs .rnd{display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mute);line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);white-space:nowrap}
.modal{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:rgba(40,25,45,.35);padding:16px}
.modal .pn{display:flex;flex-direction:column;gap:8px;background:var(--sheet);border-radius:var(--r-card);padding:20px;max-width:360px;width:100%}
.modal .pn b{font-size:17px}
.modal .pn p{margin:0 0 6px;font-size:13px;color:var(--mute)}
.modal .row{display:flex;gap:10px}
.modal .row .btn{flex:1}
@media (max-width:420px){.stem{font-size:18px}.opts.two .op{font-size:15px;padding:11px 12px}.hero h1{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="bgimg"></div>
<div class="wrap" id="app"></div>
<div id="layer"></div>

<script>
const DATA = __DATA__;
const PAPERS = [
  {id:'2026.07', name:'2026年7月'}, {id:'2025.12', name:'2025年12月'}, {id:'2025.07', name:'2025年7月'},
  {id:'2024.12', name:'2024年12月'}, {id:'2024.07', name:'2024年7月'}, {id:'2023.12', name:'2023年12月'}, {id:'2023.07', name:'2023年7月'}];
const MT = {1:'读音',2:'填词',3:'近义',4:'用法',5:'语法',6:'排序',7:'文章语法'};
const Q = {}; DATA.questions.forEach(q => Q[q.id] = q);
const QS = DATA.questions;
const BG_COUNT = 8;

const ICON = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  tap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l5 5-9 9H6v-5z"/><path d="M4 21h16"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
  eyeoff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.9 0 3.5-.6 4.9-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>',
};

const S = {
  view:'home', vp:{}, stack:[],
  prog:{}, words:{}, settings:{skin:'orchard', bg:'random'}, session:null,
  db:null, cloud:'ld', gotProg:false, gotWords:false,
  paperTab:'vocab', open:new Set(), mode:'answer', marks:new Set(), unmarks:new Set(), hideMarks:false, peekOpen:false, noteOpen:new Set(), filter:'', del:null, noteDraft:{},
  setup:{papers:new Set(['2026.07']), cat:'vocab', types:new Set([1,2,3,4,5,6,7]), holdOnly:false, order:'rand', count:10, skip:true},
};

/* ---------- 工具 ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const paperName = id => (PAPERS.find(p => p.id === id) || {name:id}).name;
const qLabel = q => `${paperName(q.p)} · 第${q.m}题·${MT[q.m]} · 问${q.n}`;
const shortP = id => id.replace(/^20(\d\d)\.0?(\d+)$/, '$1.$2');
const isRight = (q, sel) => q.ty === 'sort' ? (Array.isArray(sel) && sel[q.star - 1] === q.ans) : sel === q.ans;
function hasAns(q, sel){ return q.ty === 'sort' ? Array.isArray(sel) && sel.every(x => x) : !!sel }
function toast(msg){ const l = document.createElement('div'); l.className = 'toast'; l.textContent = msg; document.body.appendChild(l); setTimeout(() => l.remove(), 2200) }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a }

/* ---------- 云端存储 ---------- */
const queues = {};
function write(path, fn){
  if (!S.db) { toast('云端没连上，这次没存进去'); return Promise.resolve() }
  const prev = queues[path] || Promise.resolve();
  const next = prev.then(fn).catch(e => { console.error(e); toast('没存进去：' + (e && e.code === 'quota_exceeded' ? '云端空间满了' : '网络有问题，再点一次试试')) });
  queues[path] = next; return next;
}
function setProg(id, patch){
  const cur = S.prog[id] || {};
  const doc = Object.assign({sel:null, ok:null, n:0, st:'', note:'', t:0}, cur, patch);
  S.prog[id] = doc;
  return write('progress/' + id, () => S.db.doc('progress/' + id).set(doc));
}
let sessTimer = null;
function saveSession(now){
  clearTimeout(sessTimer);
  const go = () => { const s = S.session; return write('sessions/current', () => s && !s.done ? S.db.doc('sessions/current').set({qids:s.qids, i:s.i, ans:s.ans, rev:s.rev, t:Date.now()}) : S.db.doc('sessions/current').delete()) };
  if (now) return go(); sessTimer = setTimeout(go, 700);
}
function saveSettings(){ const s = {skin:S.settings.skin, bg:S.settings.bg}; try { localStorage.setItem('n1skin', JSON.stringify(s)) } catch(e){} return write('settings/main', () => S.db.doc('settings/main').set(s)) }

async function initCloud(){
  let db = null;
  try { db = await window.claude?.use?.('db') } catch(e) {}
  if (!db) { S.cloud = 'off'; render(); return }
  S.db = db;
  const timer = setTimeout(() => { if (S.cloud === 'ld') { S.cloud = 'slow'; render() } }, 10000);
  const done = () => { if (S.gotProg && S.gotWords) { clearTimeout(timer); S.cloud = 'ok'; render() } };
  const fail = e => { clearTimeout(timer); console.error(e); S.cloud = 'off'; render() };
  db.collection('progress').onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => m[d.id] = Object.assign({}, d.data()));
    S.prog = m; if (!snap.metadata.fromCache) S.gotProg = true; done(); render(true);
  }, fail);
  db.collection('words').onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => m[d.id] = Object.assign({id:d.id}, d.data()));
    S.words = m; if (!snap.metadata.fromCache) S.gotWords = true; done(); render(true);
  }, fail);
  db.doc('settings/main').onSnapshot(d => {
    if (d.exists) { const v = d.data(); if (v.skin !== S.settings.skin || v.bg !== S.settings.bg) { S.settings = {skin:v.skin || 'orchard', bg:v.bg || 'random'}; applySkin(); render(true) } }
  }, () => {});
  try {
    const d = await db.doc('sessions/current').get();
    if (d.exists && !S.session) { const v = d.data(); if (Array.isArray(v.qids) && v.qids.every(id => Q[id])) { S.session = {qids:v.qids, i:v.i || 0, ans:Object.assign({}, v.ans), rev:Object.assign({}, v.rev), done:false}; render(true) } }
  } catch(e) {}
}

/* ---------- 皮肤 ---------- */
let bgPick = 1 + Math.floor(Math.random() * BG_COUNT);
function applySkin(){
  document.body.dataset.skin = S.settings.skin;
  const n = S.settings.bg === 'random' ? bgPick : +S.settings.bg;
  document.getElementById('bgimg').style.backgroundImage = S.settings.skin === 'orchard' ? `url("bg/bg${n}.jpg")` : 'none';
}
try { const s = JSON.parse(localStorage.getItem('n1skin') || 'null'); if (s && s.skin) S.settings = s } catch(e) {}
applySkin();

/* ---------- 导航 ---------- */
function go(view, vp, push = true){ if (push) S.stack.push({view:S.view, vp:S.vp}); S.view = view; S.vp = vp || {}; S.del = null; render(); window.scrollTo(0, 0) }
function back(){ const p = S.stack.pop(); if (!p) { go('home', {}, false); return } S.view = p.view; S.vp = p.vp; S.del = null; render(); window.scrollTo(0, 0) }


/* ---------- 生词标记 ----------
   已存的词：words 集合里 q=题号、k=位置键（题号|范围|序号，整项为 题号|oN|all）
   S.marks   = 待新增的位置键
   S.unmarks = 待删除的已存词 id
   点「保存」才按最后的状态写进云端 */
function savedMap(qid){ const m = new Map(); Object.values(S.words).forEach(w => { if (w.q === qid && w.k) m.set(w.k, w.id) }); return m }
function isOn(key, saved){ return saved.has(key) ? !S.unmarks.has(saved.get(key)) : S.marks.has(key) }
function toggleMark(key){
  const qid = key.split('|')[0]; const saved = savedMap(qid);
  if (saved.has(key)) { const id = saved.get(key); S.unmarks.has(id) ? S.unmarks.delete(id) : S.unmarks.add(id) }
  else S.marks.has(key) ? S.marks.delete(key) : S.marks.add(key);
}
function pendingCount(){ return S.marks.size + S.unmarks.size }
function onCount(qid){ const saved = savedMap(qid); let n = 0; saved.forEach((id, k) => { if (!S.unmarks.has(id)) n++ }); S.marks.forEach(k => { if (k.startsWith(qid + '|')) n++ }); return n }

/* ---------- 题目渲染 ---------- */
function scopeTokens(q, sc){
  if (sc === 's') return q.stem; if (sc === 'pre') return q.pre; if (sc === 'post') return q.post;
  if (sc === 'p') return DATA.passages[q.pid].tk;
  if (sc[0] === 'o') return q.opts[+sc.slice(1) - 1].tk; return [];
}
function toks(q, sc, tokens, mk){ return tokens.map((t, i) => toksAt(q, sc, tokens, i, mk)).join('') }
/* mk: null = 普通显示；{saved} = 标生词模式 */
function toksAt(q, sc, tokens, i, mk){
  const t = tokens[i];
  if (t[2] === 'n') return '<br>';
  if (t[2] === 'b') {
    if (q.ty === 'text') return `<span class="blank${+t[0] === q.blank ? ' cur' : ''}">${esc(t[0])}</span>`;
    return '<span class="blank">（　　）</span>';
  }
  const w = t[2] === 'w' || t[2] === 'u';
  const u = t[2] === 'u' ? ' u' : '';
  if (mk && w) {
    const k = `${q.id}|${sc}|${i}`;
    return `<span class="tk${u}${isOn(k, mk.saved) ? ' on' : ''}" role="button" tabindex="0" data-act="mark" data-k="${k}">${esc(t[0])}</span>`;
  }
  return u ? `<span class="u">${esc(t[0])}</span>` : esc(t[0]);
}
function passageHTML(q, mk){
  const P = DATA.passages[q.pid];
  const parts = [[]]; P.tk.forEach((t, i) => { if (t[2] === 'n') parts.push([]); else parts[parts.length - 1].push(i) });
  const html = parts.map(idx => '<p lang="ja">' + idx.map(i => toksAt(q, 'p', P.tk, i, mk)).join('') + '</p>').join('');
  return `<div class="psg-intro">${esc(P.intro)}</div><div class="psg">${html}</div>`;
}
/* ctx: {mark:bool, sel, show, locked}
   标生词模式下页面保持干净：不显示选中、对错、解析 */
function questionHTML(q, ctx){
  const mk = ctx.mark && !S.hideMarks ? {saved:savedMap(q.id)} : null;
  const clean = ctx.mark;
  const show = ctx.show && !clean, sel = clean ? null : ctx.sel;
  let h = '';
  if (q.ty === 'text') h += passageHTML(q, mk) + `<div class="stem stem-sm" lang="ja">［${q.blank}］に入るもの</div>`;
  else if (q.ty === 'use') h += `<div class="stem stem-word" lang="ja">${toks(q, 's', q.stem, mk)}</div>`;
  else if (q.ty === 'sort') {
    const a = Array.isArray(sel) ? sel : [0, 0, 0, 0];
    const slots = a.map((v, j) => `<span class="slot${j === q.star - 1 ? ' star' : ''}${v ? ' f' : ''}" ${!ctx.locked && !clean ? `role="button" tabindex="0" data-act="unslot" data-j="${j}"` : ''}>${v ? esc(q.opts[v - 1].t) : (j === q.star - 1 ? '★' : '')}</span>`).join('');
    h += `<div class="sortline" lang="ja">${toks(q, 'pre', q.pre, mk)}${slots}${toks(q, 'post', q.post, mk)}</div>`;
    h += `<div class="chips">` + q.opts.map((o, i) => {
      const n = i + 1, used = a.includes(n);
      if (mk) { const k = `${q.id}|o${n}|all`; return `<div class="chip mk${isOn(k, mk.saved) ? ' whole' : ''}" role="button" tabindex="0" data-act="mark" data-k="${k}" lang="ja"><span class="no">${n}</span>${toks(q, 'o' + n, o.tk, mk)}</div>` }
      return `<button class="chip${used ? ' used' : ''}" lang="ja" ${!ctx.locked && !clean && !used ? `data-act="slot" data-i="${n}"` : 'tabindex="-1"'}><span class="no">${n}</span>${esc(o.t)}</button>`;
    }).join('') + '</div>';
  } else h += `<div class="stem" lang="ja">${toks(q, 's', q.stem, mk)}</div>`;

  if (q.ty !== 'sort') {
    const long = q.ty === 'use' || q.opts.some(o => o.t.length > 9);
    h += `<div class="opts${long ? '' : ' two'}${clean ? '' : ' ans'}">` + q.opts.map((o, i) => {
      const n = i + 1; let cls = 'op';
      if (mk) {
        const k = `${q.id}|o${n}|all`;
        return `<div class="op mk${isOn(k, mk.saved) ? ' whole' : ''}" role="button" tabindex="0" data-act="mark" data-k="${k}" aria-label="整项标记 ${n}"><span class="no">${n}</span><span class="tx"><span class="main" lang="ja">${toks(q, 'o' + n, o.tk, mk)}</span></span></div>`;
      }
      if (sel === n) cls += ' pick';
      if (show && n === q.ans) cls += ' right';
      if (show && sel === n && n !== q.ans) cls += ' wrong';
      if (show && o.x) cls += ' x';
      let sub = '';
      if (show) {
        if (q.ty === 'read' || q.ty === 'fill' || q.ty === 'syn') sub = o.x ? '' : [o.k, o.z].filter(Boolean).map(esc).join(' · ');
        else sub = esc(o.z || '');
      }
      const tag = show && n === q.ans ? '<span class="tag ok">正解</span>' : (show && sel === n ? '<span class="tag ng">你选</span>' : '');
      const act = !clean && !ctx.locked ? `data-act="pick" data-n="${n}"` : 'tabindex="-1"';
      return `<button class="${cls}" ${act}><span class="no">${n}</span><span class="tx"><span class="main" lang="ja">${esc(o.t)}</span>${sub ? `<span class="sub">${sub}</span>` : ''}</span>${tag}</button>`;
    }).join('') + '</div>';
  }
  if (show) h += expHTML(q, sel);
  return `<div class="q${mk ? ' marking' : ''}">${h}</div>`;
}
function expHTML(q, sel){
  let v;
  if (hasAns(q, sel)) v = isRight(q, sel) ? '<div class="verdict ok">✓ 答对了</div>' : '<div class="verdict ng">✗ 答错了</div>';
  else v = '<div class="verdict na">没作答</div>';
  let h = `<div class="exp">${v}`;
  if (q.ty === 'sort') {
    const star = q.opts[q.ans - 1].t;
    h += `<div class="full" lang="ja">${esc(q.full).replace(esc(star), `<b class="starw">${esc(star)}</b>`)}</div>`;
    h += `<div class="ord">正确顺序 ${q.order.join(' → ')}　★ = ${q.ans}</div>`;
  }
  if (q.ty === 'use') h += `<div class="pt"><b>${esc(q.word)}</b>${q.rd ? '（' + esc(q.rd) + '）' : ''}：${esc(q.wz)}</div>`;
  else h += `<div class="zh">${nl(q.zh)}</div>`;
  if (q.pt) h += `<div class="pt">${nl(q.pt)}</div>`;
  return h + '</div>';
}
function statusActs(qid){
  const p = S.prog[qid] || {};
  return `<div class="acts"><button class="act hold${p.st === 'hold' ? ' on' : ''}" data-act="st" data-st="hold" data-q="${qid}">${p.st === 'hold' ? '已在备用' : '暂时备用'}</button><button class="act pass${p.st === 'pass' ? ' on' : ''}" data-act="st" data-st="pass" data-q="${qid}">${p.st === 'pass' ? '已过 ✓' : '过'}</button></div>`;
}
/* 备注：默认收起，有内容时显示一行预览；展开后右下角圆形 ✓ 保存（离开输入框也会自动存） */
function noteHTML(qid){
  const p = S.prog[qid] || {};
  const saved = p.note || '';
  const v = S.noteDraft[qid] ?? saved;
  const open = S.noteOpen.has(qid);
  const dirty = S.noteDraft[qid] !== undefined && S.noteDraft[qid] !== saved;
  let h = `<div class="note${open ? ' open' : ''}"><button class="note-h" data-act="note" data-q="${qid}" aria-expanded="${open}"><span class="note-t">备注</span><span class="note-pv">${open ? '' : esc(saved.split('\n')[0] || '点开写备注')}</span>${ICON.chev}</button>`;
  if (open) h += `<div class="note-b"><textarea id="note-${qid}" data-note="${qid}" placeholder="写给这道题的备注">${esc(v)}</textarea><button class="note-ok${dirty ? ' dirty' : ''}" data-act="savenote" data-q="${qid}" aria-label="保存备注">${ICON.check}</button></div>`;
  return h + '</div>';
}
function modeHTML(){
  return `<div class="mode" role="group" aria-label="模式"><button class="a${S.mode === 'answer' ? ' on' : ''}" data-act="mode" data-m="answer" aria-label="选答案">${ICON.tap}<span>选答案</span></button><button class="k${S.mode === 'mark' ? ' on' : ''}" data-act="mode" data-m="mark" aria-label="标生词">${ICON.pen}<span>标生词</span></button></div>`;
}
function cloudHTML(){
  const m = {ok:['ok','已同步'], ld:['ld','连接中'], slow:['ld','云端还没回应'], off:['off','云端没连上']}[S.cloud];
  return `<span class="cloud ${m[0]}"><i></i>${m[1]}</span>`;
}
/* 标生词工具条：隐藏/显示 · 本题已标数 · 撤销改动 · 保存 */
function markBar(qid){
  if (S.mode !== 'mark') return '';
  const pend = pendingCount();
  return `<div class="markbar" role="toolbar" aria-label="生词"><button class="mb-i" data-act="hidemarks" aria-label="${S.hideMarks ? '显示标记' : '隐藏标记'}">${S.hideMarks ? ICON.eyeoff : ICON.eye}</button><span class="mb-n">本题 ${onCount(qid)} 个${pend ? `<em>· ${pend} 处没保存</em>` : ''}</span><button class="mb-i" data-act="clearmarks" ${pend ? '' : 'disabled'} aria-label="撤销没保存的改动">${ICON.undo}</button><button class="mb-ok" data-act="savemarks" ${pend ? '' : 'disabled'} aria-label="保存到暂存本">${ICON.check}</button></div>`;
}

/* ---------- 页面 ---------- */
function statsFor(qs){ let pass = 0, hold = 0, done = 0, wrong = 0; qs.forEach(q => { const p = S.prog[q.id]; if (!p) return; if (p.st === 'pass') pass++; if (p.st === 'hold') hold++; if (p.n) done++; if (p.n && p.ok === false) wrong++ }); return {pass, hold, done, wrong} }

function vHome(){
  const st = statsFor(QS);
  const staged = Object.values(S.words).filter(w => w.st !== 'book').length;
  const book = Object.values(S.words).filter(w => w.st === 'book').length;
  let h = `<header class="top"><div class="ttl"></div>${cloudHTML()}<button class="ibtn" data-act="settings" aria-label="外观">${ICON.gear}</button></header>`;
  h += `<section class="hero"><h1>橘园 N1</h1><p>真题 ${QS.length} 道 · 做过 ${st.done} · 过 ${st.pass}</p></section><div class="stack">`;
  if (S.cloud === 'off') h += `<div class="warn">云端没连上，现在做的题不会被记下来。关掉页面重新打开试试。</div>`;
  if (S.cloud === 'slow') h += `<div class="warn">云端还没回应，记录可能还没加载出来，稍等一下。</div>`;
  if (S.session && !S.session.done) {
    const s = S.session; const n = s.qids.filter(id => hasAns(Q[id], s.ans[id])).length;
    h += `<button class="resume" data-act="resume"><span class="rs-t">继续上次</span><span class="rs-s">共 ${s.qids.length} 题 · 做了 ${n} 题</span>${ICON.play}</button>`;
  }
  h += `<button class="btn pri full" data-act="setup">开始做题</button>`;
  h += `<div class="tiles"><button class="tile hold" data-act="setup" data-hold="1"><b>${st.hold}</b><span>暂时备用</span></button><button class="tile word" data-act="words"><b>${staged}</b><span>暂存生词</span></button><button class="tile" data-act="words" data-tab="book"><b>${book}</b><span>单词本</span></button></div>`;
  h += `<div class="label">题库 · 按套卷</div><div class="papers">`;
  PAPERS.forEach(p => {
    const qs = QS.filter(q => q.p === p.id);
    if (!qs.length) { h += `<div class="paper off"><span class="pp"><span class="yr">${p.name}</span><span class="ps">题目还没录入</span></span></div>`; return }
    const s = statsFor(qs); const pct = Math.round(s.pass / qs.length * 100);
    h += `<button class="paper" data-act="paper" data-p="${p.id}"><span class="pp"><span class="yr">${p.name}</span><span class="ps">单词 ${qs.length} 道 · 过 ${s.pass} · 备用 ${s.hold}</span><span class="bar"><i data-w="${pct}"></i></span></span><span class="pct">${pct}%</span></button>`;
  });
  return h + '</div></div>';
}

function vPaper(){
  const pid = S.vp.p; const qs = QS.filter(q => q.p === pid); const f = S.filter;
  const st = statsFor(qs);
  const match = q => { const p = S.prog[q.id] || {}; return !f || (f === 'hold' && p.st === 'hold') || (f === 'pass' && p.st === 'pass') || (f === 'wrong' && p.n && p.ok === false) };
  let h = `<header class="top"><button class="ibtn" data-act="back" aria-label="返回">${ICON.back}</button><div class="ttl">${paperName(pid)}</div>${cloudHTML()}</header><div class="stack">`;
  h += `<div class="tabs"><button class="on">单词</button><button disabled>阅读 · 未做</button><button disabled>听力 · 未做</button></div>`;
  h += `<div class="filters" role="group" aria-label="筛选"><button class="flt${!f ? ' on' : ''}" data-act="filter" data-f="">全部 ${qs.length}</button><button class="flt hold${f === 'hold' ? ' on' : ''}" data-act="filter" data-f="hold"><i></i>暂时备用 ${st.hold}</button><button class="flt pass${f === 'pass' ? ' on' : ''}" data-act="filter" data-f="pass"><i></i>过了 ${st.pass}</button><button class="flt wrong${f === 'wrong' ? ' on' : ''}" data-act="filter" data-f="wrong"><i></i>上次错 ${st.wrong}</button></div>`;
  let any = false;
  for (let m = 1; m <= 7; m++) {
    const all = qs.filter(q => q.m === m); if (!all.length) continue;
    const g = all.filter(match); if (f && !g.length) continue; any = true;
    const s = statsFor(all); const key = pid + m; const open = f ? true : S.open.has(key);
    h += `<div class="grp${open ? ' open' : ''}"><button class="grp-h" data-act="grp" data-k="${key}" aria-expanded="${open}"><b>第${m}题·${MT[m]}</b><span class="gs">问${all[0].n}–${all[all.length - 1].n} · 过 ${s.pass}/${all.length}</span>${ICON.chev}</button>`;
    if (open) h += '<div class="qlist">' + g.map(q => {
      const p = S.prog[q.id] || {};
      const wrong = p.n && p.ok === false;
      const cls = 'qc' + (p.st === 'hold' ? ' hold' : '') + (p.st === 'pass' ? ' pass' : '');
      return `<button class="${cls}" data-act="detail" data-q="${q.id}"><span class="qn">问${q.n}</span><span class="s" lang="ja">${esc(q.plain)}</span>${wrong ? '<span class="dot" aria-label="上次错"></span>' : ''}</button>`;
    }).join('') + '</div>';
    h += '</div>';
  }
  if (!any) h += `<div class="empty">没有符合的题</div>`;
  return h + '</div>';
}

/* 题库里的单题：小眼睛开 = 显示做过的痕迹（上次选的、正解、解析），关 = 原始题面 */
function vDetail(){
  const q = Q[S.vp.q]; const p = S.prog[q.id] || {};

  h += `<article class="card qcard"><div class="qhead"><span class="tag-l">${esc(qLabel(q))}</span>${!mark ? `<button class="peek${open ? ' on' : ''}" data-act="peekd" aria-pressed="${open}" aria-label="${open ? '收起答案' : '查看答案'}">${open ? ICON.eye : ICON.eyeoff}</button>` : ''}</div>`;

}

function availFor(su){
  return QS.filter(q => su.papers.has(q.p) && su.types.has(q.m) && (!su.holdOnly || (S.prog[q.id] || {}).st === 'hold') && (!su.skip || su.holdOnly || (S.prog[q.id] || {}).st !== 'pass'));
}
function vSetup(){
  const su = S.setup; const av = availFor(su);
  if (su.count > av.length) su.count = av.length; if (su.count < 1 && av.length) su.count = Math.min(10, av.length);

    return `<button class="ch${su.papers.has(p.id) ? ' on' : ''}" ${ok ? `data-act="su-p" data-p="${p.id}"` : 'disabled'}>${shortP(p.id)}</button>`;
  }).join('') + '</div></section>';
  h += `<section class="fs"><div class="label">题范围</div><div class="chs"><button class="ch on">单词</button><button class="ch" disabled>阅读</button><button class="ch" disabled>听力</button></div>`;
  h += `<div class="chs"><button class="ch${su.types.size === 7 ? ' on' : ''}" data-act="su-tall">全部题型</button>` + [1,2,3,4,5,6,7].map(m => `<button class="ch${su.types.has(m) && su.types.size < 7 ? ' on' : ''}" data-act="su-t" data-m="${m}">第${m}题·${MT[m]}</button>`).join('') + '</div>';
  h += `<label class="chk"><input type="checkbox" id="su-hold" data-act="su-hold" ${su.holdOnly ? 'checked' : ''}>只抽暂时备用的题</label>`;
  h += `<label class="chk"><input type="checkbox" id="su-skip" data-act="su-skip" ${su.skip ? 'checked' : ''} ${su.holdOnly ? 'disabled' : ''}>跳过已经过的</label></section>`;
  h += `<section class="fs"><div class="label">排题顺序</div><div class="chs"><button class="ch${su.order === 'rand' ? ' on' : ''}" data-act="su-o" data-o="rand">随机</button><button class="ch${su.order === 'seq' ? ' on' : ''}" data-act="su-o" data-o="seq">按问号顺序</button></div></section>`;
  h += `<section class="fs"><div class="label">题数 · 现在能抽 ${av.length} 道</div><div class="stepper"><button class="stp" data-act="su-c" data-d="-5" aria-label="减五">−</button><output>${su.count}</output><button class="stp" data-act="su-c" data-d="5" aria-label="加五">+</button><button class="ch" data-act="su-all">全部</button></div></section>`;
  h += `<button class="btn pri full" data-act="start" ${av.length && su.count ? '' : 'disabled'}>开始 ${su.count} 道</button>`;
  if (S.session && !S.session.done) h += `<div class="hint">开始新的一组会替换掉没做完的那组</div>`;
  return h + '</div>';
}

function vDrill(){
  const s = S.session; if (!s) { S.view = 'home'; return vHome() }
  const qid = s.qids[s.i]; const q = Q[qid];
  const review = s.done; const show = review || !!s.rev[qid];
  const mark = S.mode === 'mark';
  let h = `<header class="top"><button class="ibtn" data-act="${review ? 'toresult' : 'exitdrill'}" aria-label="返回">${ICON.back}</button><div class="ttl prog">${s.i + 1}<small> / ${s.qids.length}</small></div>${modeHTML()}</header><div class="stack">`;
  h += `<article class="card qcard"><div class="qhead"><span class="tag-l">${esc(qLabel(q))}</span>${!show && !mark ? `<button class="peek" data-act="peek" aria-label="当场查看答案">${ICON.eyeoff}</button>` : ''}</div>`;
  h += questionHTML(q, {mark, sel:s.ans[qid] ?? null, show, locked:show});
  if (show && !mark) h += statusActs(qid);
  h += '</article>';
  if (show && !mark) h += noteHTML(qid);
  h += `<nav class="dots" aria-label="题号">` + s.qids.map((id, i) => {
    let c = ''; const a = s.ans[id];
    if (review || s.rev[id]) c = hasAns(Q[id], a) ? (isRight(Q[id], a) ? 'ok' : 'ng') : '';
    else if (hasAns(Q[id], a)) c = 'done';
    return `<button class="${c}${i === s.i ? ' cur' : ''}" data-act="jump" data-i="${i}" aria-label="第${i + 1}题">${i + 1}</button>`;
  }).join('') + '</nav></div>';
  const last = s.i === s.qids.length - 1;
  h += `<div class="foot">${markBar(qid)}<div class="in"><button class="btn sec" data-act="prev" ${s.i ? '' : 'disabled'}>上一题</button>${review ? `<button class="btn pri" data-act="${last ? 'toresult' : 'next'}">${last ? '看结果' : '下一题'}</button>` : `<button class="btn pri" data-act="${last ? 'submit' : 'next'}">${last ? '交卷' : '下一题'}</button>`}</div></div>`;
  return h;
}

function vResult(){
  const s = S.session;
  const rows = s.qids.map((id, i) => ({q:Q[id], a:s.ans[id], i}));
  const ok = rows.filter(r => hasAns(r.q, r.a) && isRight(r.q, r.a)).length;
  let h = `<header class="top"><button class="ibtn" data-act="home" aria-label="回首页">${ICON.back}</button><div class="ttl">这组的结果</div>${cloudHTML()}</header><div class="stack">`;
  h += `<section class="score"><b>${ok}</b><span> / ${rows.length}</span><p>点一题回去看解析，再决定“过”还是“暂时备用”</p></section><div class="rlist">`;
  h += rows.map(r => {
    const has = hasAns(r.q, r.a); const right = has && isRight(r.q, r.a);
    const p = S.prog[r.q.id] || {};
    const my = has ? (r.q.ty === 'sort' ? r.a[r.q.star - 1] : r.a) : '—';
    return `<button class="rrow${p.st === 'hold' ? ' hold' : ''}${p.st === 'pass' ? ' pass' : ''}" data-act="review" data-i="${r.i}"><span class="ic ${has ? (right ? 'ok' : 'ng') : 'na'}">${has ? (right ? '✓' : '✗') : '·'}</span><span class="t"><b>问${r.q.n}</b> <small>第${r.q.m}题·${MT[r.q.m]}</small><span class="s" lang="ja">${esc(r.q.plain)}</span></span><span class="r">选 ${my} · 答 ${r.q.ans}</span></button>`;
  }).join('');
  h += `</div><button class="btn pri full" data-act="home">回到首页</button></div>`;
  return h;
}

function vWords(){
  const tab = S.vp.tab || 'staged';
  const all = Object.values(S.words).sort((a, b) => (b.t || 0) - (a.t || 0));
  const list = all.filter(w => tab === 'book' ? w.st === 'book' : w.st !== 'book');
  let h = `<header class="top"><button class="ibtn" data-act="back" aria-label="返回">${ICON.back}</button><div class="ttl">单词</div>${cloudHTML()}</header><div class="stack">`;
  h += `<div class="tabs"><button class="${tab === 'staged' ? 'on' : ''}" data-act="wtab" data-t="staged">暂存 ${all.filter(w => w.st !== 'book').length}</button><button class="${tab === 'book' ? 'on' : ''}" data-act="wtab" data-t="book">单词本 ${all.filter(w => w.st === 'book').length}</button></div>`;
  if (tab === 'staged') h += `<div class="hint">做题时标绿、存进来的词都在这里，会了的直接删掉。整理的时候跟我说一声，我从这里读出来，补上读音和意思，放进单词本。</div>`;
  if (!list.length) h += `<div class="empty">${tab === 'book' ? '单词本还是空的。暂存的词整理好以后会出现在这里。' : '还没有暂存的生词。做题时切到「标生词」，把不会的词点绿，再点 ✓ 保存。'}</div>`;
  h += list.map(w => {
    const ctx = w.s && w.s !== w.w ? esc(w.s).replace(esc(w.w), `<em>${esc(w.w)}</em>`) : '';
    const sure = S.del === w.id;
    return `<div class="wd"><div class="main"><div><span class="w" lang="ja">${esc(w.b || w.w)}</span>${w.rd ? `<span class="rd" lang="ja">${esc(w.rd)}</span>` : ''}</div>${w.z ? `<div class="z">${esc(w.z)}</div>` : ''}${ctx ? `<div class="ctx" lang="ja">${ctx}</div>` : ''}<div class="src">${esc(w.src || '')}</div></div><button class="del${sure ? ' sure' : ''}" data-act="${sure ? 'delw' : 'askdel'}" data-id="${w.id}">${sure ? '确定删除' : '删除'}</button></div>`;
  }).join('');
  return h + '</div>';

/* ---------- 主渲染 ---------- */
let lastHTML = '';
function render(fromData){
  if (fromData && document.activeElement && document.activeElement.tagName === 'TEXTAREA') return;
  const v = {home:vHome, paper:vPaper, detail:vDetail, setup:vSetup, drill:vDrill, result:vResult, words:vWords}[S.view] || vHome;
  const html = v();
  if (html !== lastHTML) { const app = document.getElementById('app'); app.innerHTML = html; lastHTML = html; paint(app) }
}
/* 宽度、背景图用脚本设置，不写在 style 属性里（页面不允许内联 style 属性） */
function paint(root){
  root.querySelectorAll('[data-w]').forEach(el => el.style.width = el.dataset.w + '%');
  root.querySelectorAll('[data-bgi]').forEach(el => el.style.backgroundImage = `url("bg/bg${el.dataset.bgi}.jpg")`);
}

/* ---------- 交互 ---------- */
function startDrill(qids){
  S.session = {qids, i:0, ans:{}, rev:{}, done:false}; S.mode = 'answer';
  saveSession(true); S.stack = [{view:'home', vp:{}}]; S.view = 'drill'; S.vp = {}; render(); window.scrollTo(0, 0);
}
async function finish(){
  const s = S.session; s.done = true;
  for (const id of s.qids) {
    const a = s.ans[id]; if (!hasAns(Q[id], a)) continue;
    const cur = S.prog[id] || {};
    await setProg(id, {sel:a, ok:isRight(Q[id], a), n:(cur.n || 0) + 1, t:Date.now()});
  }
  saveSession(true);
  S.view = 'result'; S.vp = {}; render(); window.scrollTo(0, 0);
}
function sentenceAround(tokens, i){
  let a = i, b = i;
  while (a > 0 && tokens[a - 1][2] !== 'n' && !/[。！？]$/.test(tokens[a - 1][0])) a--;
  while (b < tokens.length - 1 && tokens[b][2] !== 'n' && !/[。！？]$/.test(tokens[b][0])) b++;
  return tokens.slice(a, b + 1).map(t => t[2] === 'b' ? '（　）' : t[2] === 'n' ? '' : t[0]).join('');
}
async function saveMarks(){
  if (!S.db) { toast('云端没连上，这次没存进去'); return }
  const adds = [];
  S.marks.forEach(k => {
    const [qid, sc, idx] = k.split('|'); const q = Q[qid];
    const src = `${paperName(q.p)} 第${q.m}题·${MT[q.m]} 问${q.n}`;
    if (idx === 'all') { const o = q.opts[+sc.slice(1) - 1]; adds.push({w:o.t, b:'', s:o.t, q:qid, k, src, st:'staged', rd:'', z:'', t:Date.now()}); return }
    const tk = scopeTokens(q, sc); const t = tk[+idx]; if (!t) return;
    adds.push({w:t[0], b:t[1] || '', s:sentenceAround(tk, +idx), q:qid, k, src, st:'staged', rd:'', z:'', t:Date.now()});
  });
  const dels = [...S.unmarks];
  try {
    for (const it of adds) await S.db.collection('words').add(it);
    for (const id of dels) { await S.db.doc('words/' + id).delete(); delete S.words[id] }
    S.marks.clear(); S.unmarks.clear(); render();
    toast([adds.length ? `存了 ${adds.length} 个` : '', dels.length ? `去掉 ${dels.length} 个` : ''].filter(Boolean).join('，'));
  } catch(e) { console.error(e); toast('没存进去，再点一次试试') }
}
function nextAfterStatus(){
  const s = S.session; if (S.view !== 'drill' || !s) return;
  if (s.i < s.qids.length - 1) { s.i++; saveSession(); render(); window.scrollTo(0, 0) }
  else if (s.done) { S.view = 'result'; render(); window.scrollTo(0, 0) }
}

const A = {
  back:() => back(), home:() => { S.stack = []; go('home', {}, false) },
  settings:() => openSettings(),
  paper:d => { S.filter = ''; go('paper', {p:d.p}) },
  filter:d => { S.filter = S.filter === d.f ? '' : d.f; render() },
  grp:d => { if (S.filter) return; S.open.has(d.k) ? S.open.delete(d.k) : S.open.add(d.k); render() },
  detail:d => go('detail', {q:d.q}),
  peekd:() => { S.peekOpen = !S.peekOpen; render() },
  drillone:d => startDrill([d.q]),
  words:d => go('words', {tab:d.tab || 'staged'}),
  wtab:d => { S.vp.tab = d.t; S.del = null; render() },
  askdel:d => { S.del = d.id; render() },
  delw:d => { S.del = null; write('words/' + d.id, () => S.db.doc('words/' + d.id).delete()); delete S.words[d.id]; render() },
  setup:d => { S.setup.holdOnly = !!d.hold; go('setup') },
  'su-p':d => { const s = S.setup.papers; s.has(d.p) ? (s.size > 1 && s.delete(d.p)) : s.add(d.p); render() },
  'su-tall':() => { S.setup.types = new Set([1,2,3,4,5,6,7]); render() },
  'su-t':d => { const m = +d.m; let s = S.setup.types; if (s.size === 7) s = S.setup.types = new Set(); s.has(m) ? s.delete(m) : s.add(m); if (!s.size) S.setup.types = new Set([1,2,3,4,5,6,7]); render() },
  'su-hold':(d, el) => { S.setup.holdOnly = el.checked; render() },
  'su-skip':(d, el) => { S.setup.skip = el.checked; render() },
  'su-o':d => { S.setup.order = d.o; render() },
  'su-c':d => { const av = availFor(S.setup).length; S.setup.count = Math.max(1, Math.min(av, S.setup.count + +d.d)); render() },
  'su-all':() => { S.setup.count = availFor(S.setup).length; render() },
  start:() => {
    let av = availFor(S.setup);
    av = S.setup.order === 'seq' ? av.slice().sort((a, b) => a.p < b.p ? 1 : a.p > b.p ? -1 : a.n - b.n) : shuffle(av);
    startDrill(av.slice(0, S.setup.count).map(q => q.id));
  },
  resume:() => { S.stack = [{view:'home', vp:{}}]; S.view = 'drill'; S.vp = {}; S.mode = 'answer'; render(); window.scrollTo(0, 0) },
  exitdrill:() => { saveSession(true); S.stack = []; go('home', {}, false); toast('这组先存着，首页可以继续') },
  mode:d => { S.mode = d.m; render() },
  mark:d => { toggleMark(d.k); render() },
  hidemarks:() => { S.hideMarks = !S.hideMarks; render() },
  clearmarks:() => { S.marks.clear(); S.unmarks.clear(); render() },
  savemarks:() => saveMarks(),
  pick:d => { const s = S.session; if (S.view !== 'drill' || !s || s.done) return; const id = s.qids[s.i]; if (s.rev[id]) return; s.ans[id] = +d.n; saveSession(); render() },
  slot:d => { const s = S.session; if (!s || s.done) return; const id = s.qids[s.i]; if (s.rev[id]) return; const a = (s.ans[id] || [0,0,0,0]).slice(); const j = a.indexOf(0); if (j < 0) return; a[j] = +d.i; s.ans[id] = a; saveSession(); render() },
  unslot:d => { const s = S.session; if (!s || s.done) return; const id = s.qids[s.i]; if (s.rev[id]) return; const a = (s.ans[id] || [0,0,0,0]).slice(); a[+d.j] = 0; s.ans[id] = a; saveSession(); render() },
  peek:() => { const s = S.session; s.rev[s.qids[s.i]] = true; saveSession(); render() },
  next:() => { const s = S.session; if (s.i < s.qids.length - 1) { s.i++; saveSession(); render(); window.scrollTo(0, 0) } },
  prev:() => { const s = S.session; if (s.i > 0) { s.i--; saveSession(); render(); window.scrollTo(0, 0) } },
  jump:d => { S.session.i = +d.i; saveSession(); render(); window.scrollTo(0, 0) },
  submit:() => {
    const s = S.session; const left = s.qids.filter(id => !hasAns(Q[id], s.ans[id])).length;
    if (!left) { finish(); return }
    document.getElementById('layer').innerHTML = `<div class="modal"><div class="pn"><b>还有 ${left} 题没做</b><p>现在交卷，没做的题不会记录。</p><div class="row"><button class="btn sec" data-act="closelayer">接着做</button><button class="btn pri" data-act="forcesubmit">交卷</button></div></div></div>`;
  },
  forcesubmit:() => { closeLayer(); finish() },
  closelayer:() => closeLayer(),
  toresult:() => { S.view = 'result'; render(); window.scrollTo(0, 0) },
  review:d => { S.session.i = +d.i; S.view = 'drill'; S.mode = 'answer'; render(); window.scrollTo(0, 0) },
  st:d => {
    const cur = (S.prog[d.q] || {}).st; const off = cur === d.st;
    setProg(d.q, {st: off ? '' : d.st});
    toast(off ? '取消了' : d.st === 'pass' ? '这题过了' : '放进暂时备用了');
    if (!off) nextAfterStatus(); else render();
  },
  note:d => { S.noteOpen.has(d.q) ? S.noteOpen.delete(d.q) : S.noteOpen.add(d.q); render() },
  savenote:d => { const v = (document.getElementById('note-' + d.q) || {}).value || ''; setProg(d.q, {note:v}).then(() => { delete S.noteDraft[d.q]; render(); toast('备注存好了') }) },
  skin:d => { S.settings.skin = d.s; applySkin(); saveSettings(); openSettings(); render() },
  bg:d => { S.settings.bg = d.b; if (d.b !== 'random') bgPick = +d.b; applySkin(); saveSettings(); openSettings() },
};
function closeLayer(){ document.getElementById('layer').innerHTML = '' }
function openSettings(){
  const st = S.settings;
  let h = `<div class="sheet" data-act="closesheet"><div class="pn" data-stop="1"><div class="sh-h"><b>外观</b><button class="ibtn" data-act="closelayer">完成</button></div>`;
  h += `<div class="label">主题</div><div class="tabs"><button class="${st.skin === 'orchard' ? 'on' : ''}" data-act="skin" data-s="orchard">橘园</button><button class="${st.skin === 'plain' ? 'on' : ''}" data-act="skin" data-s="plain">简洁</button></div>`;
  if (st.skin === 'orchard') {
    h += `<div class="label">背景图</div><div class="bgs"><button class="rnd${st.bg === 'random' ? ' on' : ''}" data-act="bg" data-b="random">每次<br>随机</button>`;
    for (let i = 1; i <= BG_COUNT; i++) h += `<button class="${st.bg === String(i) ? 'on' : ''}" data-bgi="${i}" data-act="bg" data-b="${i}" aria-label="背景${i}"></button>`;
    h += '</div>';
  } else h += `<div class="hint">简洁主题用淡色纯底，跟着手机的深色 / 浅色模式变。</div>`;
  h += `<div class="hint">做题记录、备用、过、备注、生词都自动存在云端，换手机也在。</div></div></div>`;
  const layer = document.getElementById('layer'); layer.innerHTML = h; paint(layer);
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'closesheet') { if (!e.target.closest('[data-stop]')) closeLayer(); return }
  if (A[act]) { if (el.tagName !== 'INPUT') e.preventDefault(); A[act](el.dataset, el) }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click() }
});
document.addEventListener('input', e => {
  const q = e.target.dataset && e.target.dataset.note;
  if (q) { S.noteDraft[q] = e.target.value; const b = e.target.parentNode.querySelector('.note-ok'); if (b) b.classList.toggle('dirty', e.target.value !== ((S.prog[q] || {}).note || '')) }
});
document.addEventListener('focusout', e => {
  const q = e.target.dataset && e.target.dataset.note;
  if (q && S.noteDraft[q] !== undefined && S.noteDraft[q] !== ((S.prog[q] || {}).note || '')) { setProg(q, {note:S.noteDraft[q]}).then(() => { delete S.noteDraft[q]; render() }) }
});

render();
initCloud();
</script>
